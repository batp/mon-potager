# Mon Potager — déploiement Netlify (monorepo npm workspaces)
# UI Netlify : Base directory = / (racine), Package directory = apps/web

[build]
  command = "npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"
  # NEXT_PUBLIC_* sont volontairement inlinés par Next.js (clés publiques Supabase)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_VAPID_PUBLIC_KEY,NEXT_PUBLIC_SHOW_PLACEHOLDER_BANNER"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Service worker PWA (Serwist) — pas de cache agressif
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
